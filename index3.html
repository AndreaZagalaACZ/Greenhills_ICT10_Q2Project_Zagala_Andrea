
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title></title>
    <style>
        body {
            background: linear-gradient(135deg, #fff0f5, #ffe4ec, #ffd6e7);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            color: #9d5274;
            margin: 0;
            padding: 40px 20px;
        }

        div {
            text-align: center;
            background-color: #fff0f5;
            border: 2px dashed #f2a6c2;
            border-radius: 15px;
            padding: 20px;
            margin: 15px auto;
            max-width: 350px;
            color: #a64d79;
            box-shadow: 0 4px 12px rgba(219, 112, 147, 0.15);
        }

        h3 {
            color: #d65d91;
            font-size: 30px;
            background-color: #ffffff;
            display: inline-block;
            padding: 15px 30px;
            border-radius: 20px;
            border: 2px solid #ffc1d6;
            box-shadow: 0 4px 10px rgba(219, 112, 147, 0.2);
        }

        p {
            color: #a64d79;
            font-size: 16px;
            font-weight: 500;
        }

        input {
            padding: 12px 25px;
            border: 2px solid #f2a6c2;
            border-radius: 15px;
            text-align: center;
            background-color: #fffafd;
            color: #a64d79;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            outline: none;
            margin: 8px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e879a5;
            box-shadow: 0 0 10px #ffc1d6;
        }

        input::placeholder {
            color: #d99ab3;
        }

        input[type="button"] {
            background: linear-gradient(135deg, #ffb6cf, #f48fb1);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 12px 35px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(219, 112, 147, 0.25);
        }

        input[type="button"]:hover {
            background: linear-gradient(135deg, #f48fb1, #e879a5);
            transform: scale(1.05);
        }

        #output {
            background-color: #fff0f5;
            border: 2px dashed #f2a6c2;
            border-radius: 15px;
            padding: 20px;
            min-height: 25px;
        }
        @media (max-width: 480px) {
            body {
                padding: 0 18px 45px;
            }
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #ff8bcb;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;

            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            white-space: nowrap;
        }

        ul li a:hover {
            background-color: #ffa4eb;
        }

        ul li.right {
            margin-left: auto;
            color: white;
            text-align: center;
            padding: 14px 16px;
            white-space: nowrap;
        }

        .receiptdiv {
            text-align: center;
            box-shadow: 0px 8px 14px 1px #8e8080;
            border-radius: 15px;
            background: linear-gradient(0deg, #ffffff 0%, #eeeae7 100%);
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            padding: 20px;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #ffe5cc, #cfcbc2);
            color: #6d4b5a;
            font-family: "Comic Sans MS", cursive;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 10px 25px;
            cursor: pointer;
            box-shadow: 0px 4px 8px #b89ca8;
            transition: 0.2s;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index2.html">Club Members</a></li>
        <li><a href="index3.html">Element Checker</a></li>
        <li><a href="index4.html">Meet the Creator</a></li>
        <li class="right">Psychosophy Club || Andrea C. Zagala</li>
    </ul>
    <h3>🎀 Non-Metal Elements 🎀</h3>
    <p>Instructions</p><br>
    <p>Enter the symbol of a non-metal element</p><br><br>
    <p>Element Symbol</p>
    <input type="text" id="symbol" placeholder="Enter the element symbol"><br>
    <input type="button" py-click="check" value="Search"><br>
    <p>Result</p>
    <div id="output3" style="background-color: pink"></div>
    <py-script src="main3.py"></py-script>
</body>
</html>
